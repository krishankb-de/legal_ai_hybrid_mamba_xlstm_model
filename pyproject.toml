[project]
name = "lexhybrid"
version = "0.1.0"
description = "Citation-faithful, retrieval-gated language model for DACH and EU law: a hybrid Mamba-3 / mLSTM / attention decoder that cites by pointer, with a renderer and a verifier"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["legal", "nlp", "language-model", "mamba", "xlstm", "retrieval", "german", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Natural Language :: German",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    # One torch build for every environment. 2.11.0 is the newest build the PyTorch cu128 index
    # carries, and CUDA 12.8 is what the H100 cluster's driver supports.
    "torch==2.11.0",
    "pytorch-lightning>=2.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "transformers>=4.45",
    "datasets>=3.0",
    "einops>=0.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "packaging>=23.0",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    "requests>=2.31",  # corpus collectors; was only transitive
    "datasketch>=1.6",  # MinHash deduplication; pulls scipy
    "bm25s[stem]>=0.3.11",  # lexical retrieval; [stem] pulls PyStemmer (Snowball German)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pathspec>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexhybrid"]

[project.urls]
Repository = "https://github.com/krishankb-de/legal_ai_hybrid_mamba_xlstm_model"
Issues = "https://github.com/krishankb-de/legal_ai_hybrid_mamba_xlstm_model/issues"

[tool.hatch.build.targets.sdist]
# Anchored with "/": an unanchored "README.md" would also match nested README files.
include = ["/lexhybrid", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.uv]
# The lock is resolved for exactly the two platforms this project runs on: macOS
# arm64 and Linux x86_64 (GitHub Actions runners and the H100 cluster nodes).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# On Linux torch comes from the CUDA 12.8 index (the default PyPI Linux wheel is built for a
# newer CUDA and fails on the cluster's driver). On macOS it comes from PyPI.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "slow: CPU test slower than ~10 s; run by validate.sh --full and --ci",
    "cuda: needs a CUDA GPU; runs on the cluster (scripts/slurm/gpu_tests.sh)",
    "multigpu: needs two or more CUDA GPUs; runs on the cluster (scripts/slurm/multigpu_tests.sh)",
    "linux_only: needs Linux (Inductor CPU compile, FlexAttention on CPU); runs in CI",
    "network: needs live external services; set LEXHYBRID_NETWORK_TESTS=1 (weekly CI job)",
    "reference: needs the upstream reference implementation checkout; skipped when it is absent",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["Reference", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is the formatter's job; long explanatory comments are allowed
    "E741",  # single-letter names (B, C, D, L) follow the SSM papers' notation
    "B905",  # zip() without strict= is used deliberately on equal-length pairs
]

[tool.ruff.lint.isort]
known-first-party = ["lexhybrid"]

[tool.coverage.run]
source = ["lexhybrid"]

[tool.coverage.report]
# Measured 94.5% of lexhybrid/ at the time it was set (validate.sh --full --coverage on macOS
# arm64), rounded down to the nearest 5. Raise it as coverage grows; do not lower it without a note.
fail_under = 90
show_missing = true
skip_covered = true
