[project]
name = "lexhybrid"
version = "0.1.0"
description = "DACH legal, citation-faithful, retrieval-gated hybrid Mamba-3 / mLSTM / attention decoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Decision 18: one torch for every environment. 2.11.0 is the newest build the PyTorch
    # cu128 index carries, and CUDA 12.8 is what the aisc H100 driver supports.
    "torch==2.11.0",
    "pytorch-lightning>=2.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "transformers>=4.45",
    "datasets>=3.0",
    "einops>=0.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "packaging>=23.0",
    "tqdm>=4.66",
    "tensorboard>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pathspec>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexhybrid"]

[tool.hatch.build.targets.sdist]
# Anchored with "/": an unanchored "README.md" also matched Reference/**/README.md.
include = ["/lexhybrid", "/README.md", "/pyproject.toml"]

[tool.uv]
# The lock is resolved for exactly the two platforms this project runs on: the Mac
# (arm64) and Linux x86_64 (GitHub Actions runners and the aisc H100 nodes).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# On Linux torch comes from the CUDA 12.8 index (the default PyPI Linux wheel is built for a
# newer CUDA and fails on the cluster's driver). On macOS it comes from PyPI.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "slow: CPU test slower than ~10 s; run by validate.sh --full and --ci",
    "cuda: needs a CUDA GPU; runs on the cluster (scripts/slurm/gpu_tests.sh)",
    "multigpu: needs two or more CUDA GPUs; runs on the cluster (scripts/slurm/multigpu_tests.sh)",
    "linux_only: needs Linux (Inductor CPU compile, FlexAttention on CPU); runs in CI",
    "network: needs live external services; set LEXHYBRID_NETWORK_TESTS=1 (weekly CI job)",
    "reference: needs Reference/hybrid_model_mamba_xlstm; skipped after P1-Z",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["Reference", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is the formatter's job; long explanatory comments are allowed
    "E741",  # single-letter names (B, C, D, L) follow the SSM papers' notation
    "B905",  # zip() without strict= is used deliberately on equal-length pairs
]

[tool.ruff.lint.isort]
known-first-party = ["lexhybrid"]

[tool.coverage.run]
source = ["lexhybrid"]

[tool.coverage.report]
# P1-W5 (2026-09-27): measured 94.5% of lexhybrid/ (1,772 of 1,875 lines, validate.sh --full
# --coverage on macOS arm64), rounded down to the nearest 5. Raised as phases add coverage; never
# lowered without a note.
fail_under = 90
show_missing = true
skip_covered = true
