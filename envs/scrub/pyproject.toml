# The LER scrub's own environment (plan P3-R1, decision 22): flair needs transformers < 5, the main
# environment keeps transformers 5 (the teacher path is verified on it), so the scrub runs here.
# Build it with `uv sync --locked --project envs/scrub`; check it with
# `envs/scrub/.venv/bin/python scripts/check_env.py --scrub`. Nothing here imports lexhybrid.
[project]
name = "lexhybrid-scrub"
version = "0.1.0"
description = "Isolated environment for the German legal-entity scrub (flair/ner-german-legal)"
requires-python = "==3.11.*"
dependencies = [
    "flair==0.15.1",
    # Decision 18's torch, from the same indexes as the main environment.
    "torch==2.11.0",
    "packaging>=23.0",  # scripts/check_env.py --scrub
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
