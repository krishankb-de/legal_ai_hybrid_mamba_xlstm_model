# The teacher server's own environment: vLLM pins its own torch, so it never enters the main
# environment. Built on the cluster into .venv-vllm by scripts/slurm/setup_vllm.sh
# (`UV_PROJECT_ENVIRONMENT=.venv-vllm uv sync --locked --project envs/vllm`). Nothing here imports
# lexhybrid: jobs start `vllm serve` from it and talk to it over HTTP from the main environment.
# vLLM 0.19.1 is the newest release whose PyPI wheel is built for CUDA 12 (0.20 moved to CUDA 13,
# which the cluster's CUDA 12.8 driver cannot run); its torch 2.10.0 wheel on PyPI is cu128.
[project]
name = "lexhybrid-vllm"
version = "0.1.0"
description = "Isolated environment for the vLLM teacher server"
requires-python = "==3.11.*"
dependencies = [
    "vllm==0.19.1",
    "transformers==5.5.3",  # what vLLM 0.19.1's own tests run against (requirements/test.txt)
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
