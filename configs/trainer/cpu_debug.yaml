# CPU trainer for smoke tests and the validate.sh config gate. Two optimizer steps.
accelerator: cpu
devices: 1
precision: 32-true
strategy: auto
compile_model: false
max_epochs: -1
max_steps: 2
val_every_opt_steps: 1
check_val_every_n_epoch: null
log_every_n_steps: 1
accumulate_grad_batches: 1
enable_checkpointing: false
enable_progress_bar: false
enable_model_summary: false
num_sanity_val_steps: 0
limit_val_batches: 1
