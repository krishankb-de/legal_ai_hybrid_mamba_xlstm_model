# The teacher (default): with gradient checkpointing it fits at 4,096-token
# rows on 4 x H100 at 43.18 GB and 1.44x the 1.7B step; without it, OOM.
# The training wrappers turn checkpointing on for it (train_pretrain_1gpu.sh).
teacher: Qwen/Qwen3-8B-Base
revision: main  # what fetch_hf.sh fetches (tests/test_slurm_wrappers.py ties the two)
dtype: bfloat16
alpha: 0.5
temperature: 2.0
slab: 512
