# Checkpointing: keep only last.ckpt by default (save_top_k 0; the SAVE_TOP_K environment
# variable in the training wrappers sets how many best-by-metric checkpoints to keep besides it).
# The filename has no metric in it: a "/" in a metric name once turned every save
# into a directory in the upstream implementation.
checkpoint:
  monitor: val/loss
  mode: min
  save_top_k: 0
  save_last: true
  filename: "step{step:06d}"
  auto_insert_metric_name: false
  every_n_train_steps: 1000

lr_monitor:
  enabled: true
  logging_interval: step

# STEPSTATS lines (s/step, peak GB) from every rank: the KD memory probe and the screen tables
# read them from the job log.
step_stats:
  enabled: true
  every_n_steps: 500
  skip_steps: 5

# Loss-spike diagnostics (lexhybrid/training/diagnostics.py). Off on every
# run; scripts/slurm/diag_spike.sh turns it on. stop_at_step 0 = train to max_steps.
diagnostics:
  enabled: false
  every_n_steps: 10
  spike_factor: 5.0
  stop_at_step: 0
